# Builds the static web version of GRWAI and publishes it to GitHub Pages — free, no server.
# Result: https://<your-github-user>.github.io/<repo-name>/  (open it on any phone; "Add to Home Screen" makes it full-screen)
#
# One-time setup after pushing this repo to GitHub:
#   Repo → Settings → Pages → "Build and deployment" → Source: **GitHub Actions**
# Every push to `main` then redeploys automatically (also runnable by hand from the Actions tab).
name: Deploy web prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project sites live under /<repo-name>/ — app.config.js turns WEB_BASE_URL into expo.experiments.baseUrl
      - run: WEB_BASE_URL=/${{ github.event.repository.name }} npx expo export --platform web
      # GitHub Pages serves 404.html for unknown paths → deep links to dynamic routes (e.g. /outfit/soft-power) still load the app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
